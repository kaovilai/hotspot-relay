name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Ensure compileSdk platform is installed
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          for pkg in "platforms;android-37.0" "platforms;android-37"; do
            "$SDKMANAGER" "$pkg" > /dev/null 2>&1 && break
          done
          "$SDKMANAGER" "build-tools;37.0.0" > /dev/null 2>&1 || true
          if [ ! -d "$ANDROID_SDK_ROOT/platforms/android-37" ] && \
             [ ! -d "$ANDROID_SDK_ROOT/platforms/android-37.0" ]; then
            echo "android-37 platform not available on this runner" >&2
            exit 1
          fi

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: hotspot-relay-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
